  <script>
    const GITHUB_USER='Daugavan',MAX_REPOS=6,API_BASE_URL='https://api.github.com/users/';
    const STATIC_STARS=350,STATIC_COMMITS=18;
    const LANGUAGE_COLORS={JavaScript:'#f1e05a',TypeScript:'#2b7489',Python:'#3572A5',CSS:'#563d7c',HTML:'#e34c26',Java:'#b07219',Shell:'#89e051',Go:'#00ADD8',Rust:'#dea584',C:'#555555','C#':'#f34b7d',Ruby:'#701516',Vue:'rgb(65, 184, 131)'};
    const mc=document.getElementById('mainContent');
    const elAvatar=document.getElementById('avatar'),elName=document.getElementById('name'),elLoginLine=document.getElementById('loginLine'),elBio=document.getElementById('bio'),elActions=document.getElementById('actions'),elReposWrap=document.getElementById('repos'),elStarsN=document.getElementById('starsN'),elReposN=document.getElementById('reposN'),elCommitsN=document.getElementById('commitsN'),elRepoCount=document.getElementById('repoCount'),elProgress=document.getElementById('progressFill');
    const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const lc=l=>LANGUAGE_COLORS[l]||'var(--jungle-accent)';
    function anim(el,t){const d=1200,s=performance.now();function f(n){const p=Math.min((n-s)/d,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(e*t).toLocaleString();if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
    function copyStatus(m){let el=document.getElementById('cs');if(!el){el=document.createElement('div');el.id='cs';el.className='copy-status';el.setAttribute('role','status');elActions.appendChild(el)}el.textContent=m;el.style.animation='none';void el.offsetWidth;el.style.animation='fadeInOut 2s forwards'}
    async function copy(t){try{await navigator.clipboard.writeText(t);copyStatus('Copied!')}catch{copyStatus('Copy failed.')}}
    function renderProfile(p){elAvatar.src=p.avatar_url;elAvatar.alt=(p.login||GITHUB_USER)+' avatar';elName.textContent=p.name||p.login||GITHUB_USER;elLoginLine.textContent=(p.login||GITHUB_USER);elBio.textContent=p.bio||'';anim(elReposN,p.public_repos??0);anim(elStarsN,STATIC_STARS);anim(elCommitsN,STATIC_COMMITS);setTimeout(()=>elProgress.style.width=Math.min(100,(p.public_repos||0)/100*100)+'%',300);elActions.innerHTML='';const v=document.createElement('a');v.className='btn view';v.textContent='View Profile';v.href=p.html_url;v.target='_blank';v.rel='noopener noreferrer';elActions.appendChild(v);const c=document.createElement('button');c.className='btn copy';c.textContent='Copy Link';c.addEventListener('click',()=>copy(p.html_url));elActions.appendChild(c)}
    function renderRepos(repos,total){const s=[...repos].sort((a,b)=>b.stargazers_count-a.stargazers_count).slice(0,MAX_REPOS);elReposWrap.innerHTML='';if(!s.length){elReposWrap.innerHTML='<div>No public repositories found.</div>'}else{s.forEach(r=>{const a=document.createElement('a');a.className='repo';a.href=r.html_url;a.target='_blank';a.rel='noopener noreferrer';const lc2=r.language?`<div class="topic"><span class="lang-color" style="background:${lc(r.language)}"></span>${esc(r.language)}</div>`:'';const tc=(r.topics||[]).slice(0,2).map(t=>`<div class="topic">${esc(t)}</div>`).join('');a.innerHTML=`<div><div class="title">${esc(r.name)}</div><div class="desc">${esc(r.description||'No description.')}</div></div><div><div class="topics-row">${lc2}${tc}</div><div class="meta-row"><span>${r.stargazers_count} ★</span><span>Updated ${new Date(r.updated_at).toLocaleDateString()}</span></div><div class="glow-acc" aria-hidden="true"></div></div>`;elReposWrap.appendChild(a)})}elRepoCount.textContent=`${s.length} of ${total} shown`}
    function renderError(m){elName.textContent='Error';elBio.textContent=m;elReposWrap.innerHTML=`<div style="padding:12px;background:rgba(255,0,0,0.08);border-radius:10px;color:#ff6666;border:1px solid rgba(255,0,0,0.2)">${m}</div>`;elRepoCount.textContent=''}
    async function main(){mc.setAttribute('aria-busy','true');try{const h={Accept:'application/vnd.github.v3+json'};const [pr,rr]=await Promise.all([fetch(API_BASE_URL+GITHUB_USER,{headers:h}),fetch(API_BASE_URL+GITHUB_USER+'/repos?per_page=100&sort=updated',{headers:h})]);if(!pr.ok)throw new Error('User not found: '+pr.status);const profile=await pr.json(),repos=rr.ok?await rr.json():[];renderProfile(profile);renderRepos(repos,profile.public_repos)}catch(e){console.error(e);renderError('Could not load profile. Please check the username or API status.')}finally{mc.setAttribute('aria-busy','false')}}
    main();
  </script>
