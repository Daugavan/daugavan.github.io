name: Publish portfolio and client previews

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      client:
        description: 'Optional registered client slug for rollback'
        type: string
        default: ''
      ref:
        description: 'Optional full client commit SHA; requires client'
        type: string
        default: ''

permissions:
  contents: read

# Checkout main after acquiring the lock so queued runs build the latest portfolio.
concurrency:
  group: github-pages-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check portfolio and publication logic
        run: node --test tests/security.test.mjs tests/repositories.test.mjs tests/clients.test.mjs
      - name: Fetch private client website files
        env:
          CLIENT_REPO_READ_TOKEN: ${{ secrets.CLIENT_REPO_READ_TOKEN }}
          ROLLBACK_CLIENT: ${{ inputs.client }}
          ROLLBACK_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          if [[ -n "$ROLLBACK_CLIENT" || -n "$ROLLBACK_REF" ]]; then
            node scripts/fetch-client-sources.mjs --client "$ROLLBACK_CLIENT" --ref "$ROLLBACK_REF"
          else
            node scripts/fetch-client-sources.mjs
          fi
      - name: Prepare complete publication
        run: node scripts/prepare-public.mjs --clients
      - name: Install browser verifier
        run: |
          npm install --no-save --package-lock=false playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Verify client navigation and presentation
        run: node tests/clients-browser.cjs ./node_modules/playwright
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified website
        id: deployment
        uses: actions/deploy-pages@v4
