name: Refresh public repository statistics

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-repositories.yml'
      - 'scripts/update-repositories.mjs'

permissions:
  contents: write
  pages: write

# Both publishers edit statistics-data.js; serialize their commits.
concurrency:
  group: publish-public-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch and validate public repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-repositories.mjs
      - name: Check publication
        run: |
          node --test tests/security.test.mjs tests/repositories.test.mjs
          node scripts/prepare-public.mjs
      - name: Save verified statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repositories-snapshot.json statistics-data.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified public repository statistics'
          git push origin HEAD:main
      # GITHUB_TOKEN commits do not automatically start a Pages build.
      - name: Publish updated statistics on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
