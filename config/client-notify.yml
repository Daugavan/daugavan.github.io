name: Notify portfolio preview publisher

# Install this file as .github/workflows/notify-portfolio.yml in each client repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: notify-portfolio
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request client preview publication
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/Daugavan/daugavan.github.io/actions/workflows/deploy-pages.yml/dispatches -f ref=main
