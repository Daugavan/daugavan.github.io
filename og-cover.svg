<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Daugavan — PromptFlower and quiet tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f1626"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5dffce"/>
      <stop offset="60%" stop-color="#9d7bff"/>
      <stop offset="100%" stop-color="#ff7ad9"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#5dffce" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#5dffce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#ff7ad9" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ff7ad9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  
  <g opacity=".07" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>

  
  <g transform="translate(80, 110)">
    <circle cx="56" cy="56" r="46" fill="none" stroke="url(#g)" stroke-width="2" opacity=".55"/>
    <text x="56" y="72"
          font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="52" font-weight="700" fill="url(#g)"
          text-anchor="middle">D</text>
  </g>

  
  <g transform="translate(220, 160)">
    <text font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="20" fill="#5dffce" letter-spacing="3">
      DAUGAVAN · BUILDING IN THE OPEN
    </text>

    <text y="100" font-family="Georgia, 'Times New Roman', serif"
          font-style="italic" font-size="92" fill="#f4efe6" font-weight="400"
          letter-spacing="-2">
      PromptFlower
    </text>
    <text y="190" font-family="Georgia, 'Times New Roman', serif"
          font-style="italic" font-size="56" fill="rgba(244,239,230,.65)" font-weight="400">
      &amp; quiet tools.
    </text>

    <text y="290" font-family="Georgia, 'Times New Roman', serif"
          font-size="28" fill="rgba(244,239,230,.7)">
      A Swedish builder's workshop — live GitHub stats, public projects,
    </text>
    <text y="328" font-family="Georgia, 'Times New Roman', serif"
          font-size="28" fill="rgba(244,239,230,.7)">
      and a garden of small honest tools.
    </text>
  </g>

  
  <g transform="translate(80, 540)">
    <text font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="18" fill="rgba(244,239,230,.5)" letter-spacing="2">
      github.com/Daugavan  ·  promptflower.app  ·  lovable.dev/@daugavan
    </text>
  </g>
